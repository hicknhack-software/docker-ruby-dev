name: Docker Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  # Official Ruby updates have no fixed publication time. Check published images
  # every six hours, matching the upstream version-check cadence.
  schedule:
    - cron: "37 */6 * * *"

permissions:
  contents: read
  packages: write

# Serialize publishers to avoid overlapping pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ruby-dev:${{ matrix.ruby }}${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - 4.0.9
          - 3.4.12
          - 3.3.13
        variant: ["", "-alpine"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check upstream image
        id: upstream
        env:
          BASE_IMAGE_TAG: ${{ matrix.ruby }}${{ matrix.variant }}
          SOURCE_REVISION: ${{ github.sha }}
          FORCE_BUILD: ${{ github.event_name != 'schedule' }}
        run: python3 .github/scripts/check-base-image.py

      - uses: docker/build-push-action@v6
        if: steps.upstream.outputs.changed == 'true'
        with:
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          pull: true
          build-args: |
            BASE_IMAGE_TAG=${{ matrix.ruby }}${{ matrix.variant }}@${{ steps.upstream.outputs.base_digest }}
          labels: |
            org.opencontainers.image.base.name=docker.io/library/ruby:${{ matrix.ruby }}${{ matrix.variant }}
            org.opencontainers.image.base.digest=${{ steps.upstream.outputs.base_digest }}
            org.opencontainers.image.revision=${{ github.sha }}

          tags: |
            hnhs/ruby-dev:${{ matrix.ruby }}${{ matrix.variant }}
            ghcr.io/hicknhack-software/ruby-dev:${{ matrix.ruby }}${{ matrix.variant }}

            ${{ matrix.ruby == '4.0.9' && format('hnhs/ruby-dev:latest{0}', matrix.variant) || '' }}
            ${{ matrix.ruby == '4.0.9' && format('ghcr.io/hicknhack-software/ruby-dev:latest{0}', matrix.variant) || '' }}

            ${{ matrix.ruby == '4.0.9' && format('hnhs/ruby-dev:4{0}', matrix.variant) || '' }}
            ${{ matrix.ruby == '4.0.9' && format('ghcr.io/hicknhack-software/ruby-dev:4{0}', matrix.variant) || '' }}

            ${{ matrix.ruby == '4.0.9' && format('hnhs/ruby-dev:4.0{0}', matrix.variant) || '' }}
            ${{ matrix.ruby == '4.0.9' && format('ghcr.io/hicknhack-software/ruby-dev:4.0{0}', matrix.variant) || '' }}

            ${{ matrix.ruby == '3.4.12' && format('hnhs/ruby-dev:3{0}', matrix.variant) || '' }}
            ${{ matrix.ruby == '3.4.12' && format('ghcr.io/hicknhack-software/ruby-dev:3{0}', matrix.variant) || '' }}

            ${{ matrix.ruby == '3.4.12' && format('hnhs/ruby-dev:3.4{0}', matrix.variant) || '' }}
            ${{ matrix.ruby == '3.4.12' && format('ghcr.io/hicknhack-software/ruby-dev:3.4{0}', matrix.variant) || '' }}

            ${{ matrix.ruby == '3.3.13' && format('hnhs/ruby-dev:3.3{0}', matrix.variant) || '' }}
            ${{ matrix.ruby == '3.3.13' && format('ghcr.io/hicknhack-software/ruby-dev:3.3{0}', matrix.variant) || '' }}

          cache-from: type=gha
          cache-to: type=gha,mode=max
